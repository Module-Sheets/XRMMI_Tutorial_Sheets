<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>XRMMI Refresh Frame</title>
	<style>
		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		iframe {
			width: 100%;
			height: 100vh;
			border: none;
			display: block;
		}
	</style>
</head>
<body>
	<iframe src="https://module-sheets.github.io/XRMMI_Tutorial_Sheets/?t=" id="f"></iframe>
	<script>
		document.getElementById('f').src += (new Date()).getTime();
	</script>
</body>
</html>
